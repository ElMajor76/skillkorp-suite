name: CI — Lint, tests & paquets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dépendances de test
        run: python -m pip install --upgrade pip flake8
      - name: Lint (erreurs bloquantes)
        run: flake8 skillkorp bin/skillkorpctl tests packaging tools --count --select=E9,F63,F7,F82,F401,F811,F841 --show-source --statistics
      - name: Style (informatif)
        run: flake8 skillkorp bin/skillkorpctl --count --exit-zero --max-line-length=120 --statistics
      - name: Tests unitaires
        run: HOME="$RUNNER_TEMP/home" python -m unittest discover -s tests -t . -v

  packages:
    name: Paquets (deb, rpm, arch)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Outils de construction
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools zstd lintian
      - name: Construction
        run: python3 packaging/build_packages.py
      - name: Lintian
        run: lintian --no-tag-display-limit --suppress-tags no-manual-page,initial-upload-closes-no-bugs dist/*.deb || true
      - name: Contrôle des paquets
        run: |
          dpkg-deb --info dist/*.deb
          for f in dist/*.rpm; do rpm -qpl "$f" >/dev/null && rpm -qpR "$f"; done
          tar -tf dist/*-any.pkg.tar.zst | head
      - uses: actions/upload-artifact@v4
        with:
          name: skillkorp-suite-packages
          path: dist/

  install-test:
    name: Installation ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: fedora:41
            install: dnf install -y ./dist/*.fc.noarch.rpm
          - image: opensuse/tumbleweed
            install: zypper --non-interactive install --allow-unsigned-rpm ./dist/*.suse.noarch.rpm
          - image: archlinux:latest
            install: pacman -Sy --noconfirm && pacman -U --noconfirm ./dist/*-any.pkg.tar.zst
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skillkorp-suite-packages
          path: dist
      - name: Installer le paquet
        run: ${{ matrix.install }}
      - name: Vérifier
        run: |
          skillkorpctl --version
          skillkorpctl status --json
          skillkorpctl doctor || true
          python3 -I -c 'import sys; sys.path.insert(0, "/usr/share/skillkorp-suite"); import gi; gi.require_version("Gtk", "4.0"); gi.require_version("Adw", "1"); import skillkorp.gui'
