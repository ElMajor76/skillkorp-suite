<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 460" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e38"/>
      <stop offset="50%" stop-color="#1e2129"/>
      <stop offset="100%" stop-color="#14171d"/>
    </linearGradient>
    <linearGradient id="btnLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4252"/>
      <stop offset="100%" stop-color="#2e3440"/>
    </linearGradient>
    <linearGradient id="btnRightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b4252"/>
      <stop offset="100%" stop-color="#2e3440"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c566a"/>
      <stop offset="50%" stop-color="#d8dee9"/>
      <stop offset="100%" stop-color="#4c566a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Mouse Silhouette Shadow -->
  <path d="M 150 25 C 215 25, 245 80, 245 200 C 245 320, 225 435, 150 435 C 75 435, 55 320, 55 200 C 55 80, 85 25, 150 25 Z"
        fill="#000000" opacity="0.35" transform="translate(0, 8)"/>

  <!-- Mouse Main Body Outer Shell -->
  <path id="body-shell"
        d="M 150 25 C 215 25, 245 80, 245 200 C 245 320, 225 435, 150 435 C 75 435, 55 320, 55 200 C 55 80, 85 25, 150 25 Z"
        fill="url(#bodyGrad)" stroke="#434c5e" stroke-width="2.5"/>

  <!-- Palm rest contour & Skillkorp Brand mark -->
  <path d="M 85 260 C 105 235, 195 235, 215 260 C 225 330, 205 405, 150 415 C 95 405, 75 330, 85 260 Z"
        fill="#222630" stroke="#353b49" stroke-width="1.2" opacity="0.7"/>
  <text x="150" y="345" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6c7a96" text-anchor="middle" letter-spacing="3">SKILLKORP</text>
  <text x="150" y="362" font-family="sans-serif" font-size="9" fill="#4c566a" text-anchor="middle" letter-spacing="1.5">M20 ULTIMATE</text>

  <!-- Button 1: Left Click -->
  <path id="btn-left"
        d="M 144 26 C 95 28, 68 75, 62 175 C 90 185, 138 185, 144 180 Z"
        fill="url(#btnLeftGrad)" stroke="#4c566a" stroke-width="1.5" cursor="pointer"/>

  <!-- Button 2: Right Click -->
  <path id="btn-right"
        d="M 156 26 C 205 28, 232 75, 238 175 C 210 185, 162 185, 156 180 Z"
        fill="url(#btnRightGrad)" stroke="#4c566a" stroke-width="1.5" cursor="pointer"/>

  <!-- Central Gap & Wheel housing -->
  <rect x="142" y="30" width="16" height="155" rx="8" fill="#121417" stroke="#2e3440" stroke-width="1"/>

  <!-- Button 3: Scroll Wheel (Middle Click) -->
  <g id="btn-wheel" cursor="pointer">
    <rect x="143" y="48" width="14" height="60" rx="7" fill="url(#wheelGrad)" stroke="#88c0d0" stroke-width="1.2"/>
    <line x1="144" y1="58" x2="156" y2="58" stroke="#2e3440" stroke-width="2"/>
    <line x1="144" y1="68" x2="156" y2="68" stroke="#2e3440" stroke-width="2"/>
    <line x1="144" y1="78" x2="156" y2="78" stroke="#2e3440" stroke-width="2"/>
    <line x1="144" y1="88" x2="156" y2="88" stroke="#2e3440" stroke-width="2"/>
    <line x1="144" y1="98" x2="156" y2="98" stroke="#2e3440" stroke-width="2"/>
  </g>

  <!-- Button 4: Side Forward (Latéral Avant) -->
  <path id="btn-side-fwd"
        d="M 54 165 C 48 168, 48 202, 54 205 C 57 192, 57 178, 54 165 Z"
        fill="#3584e4" stroke="#78aeed" stroke-width="1.5" cursor="pointer"/>

  <!-- Button 5: Side Backward (Latéral Arrière) -->
  <path id="btn-side-bwd"
        d="M 55 215 C 49 218, 49 252, 55 255 C 58 242, 58 228, 55 215 Z"
        fill="#3584e4" stroke="#78aeed" stroke-width="1.5" cursor="pointer"/>

  <!-- Pointer Callout Badges -->
  <!-- Badge 1: Clic Gauche -->
  <g id="badge-1" transform="translate(95, 110)">
    <circle cx="0" cy="0" r="14" fill="#3584e4" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  </g>

  <!-- Badge 2: Clic Droit -->
  <g id="badge-2" transform="translate(205, 110)">
    <circle cx="0" cy="0" r="14" fill="#3584e4" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  </g>

  <!-- Badge 3: Molette (Bouton 3) -->
  <g id="badge-3" transform="translate(150, 140)">
    <circle cx="0" cy="0" r="14" fill="#3584e4" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  </g>

  <!-- Badge 4: Latéral Avant (Bouton 4) -->
  <g id="badge-4" transform="translate(28, 185)">
    <circle cx="0" cy="0" r="14" fill="#3584e4" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <line x1="14" y1="0" x2="25" y2="0" stroke="#3584e4" stroke-width="2"/>
  </g>

  <!-- Badge 5: Latéral Arrière (Bouton 5) -->
  <g id="badge-5" transform="translate(28, 235)">
    <circle cx="0" cy="0" r="14" fill="#3584e4" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <line x1="14" y1="0" x2="25" y2="0" stroke="#3584e4" stroke-width="2"/>
  </g>
</svg>
